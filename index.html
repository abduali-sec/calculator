<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Multilingual Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
</div>
  <div class="app shell">
    <header class="app-header">
      <div class="brand">
        <h1 id="title">Calculator</h1>
        <small id="version">v1.0.0.</small>
      </div>
      <div class="controls">
        <select id="langSelect" aria-label="Language switch">
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
        <button id="degBtn" data-i18n="btn.rad">RAD</button>
      </div>
    </header>

    <main class="layout">
      <nav class="sidebar">
        <div class="big-section">1. Calculator</div>
        <ul class="cats" id="catList">
          <li data-cat="simple" class="active">🧮 Простой</li>
          <li data-cat="scientific">🔬 Научный</li>
          <li data-cat="financial">📊 Финансовый</li>
          <li data-cat="programmer">🧑‍💻 Программистский</li>
          <li data-cat="geometry">📐 Геометрический</li>
          <li data-cat="algebra">🧮 Алгебраический</li>
          <li data-cat="matrix">🧪 Матричный</li>
          <li data-cat="converter">📏 Конвертер единиц</li>
          <li data-cat="stats">📈 Статистический</li>
          <li data-cat="graphical">📐 Графический</li>
          <li data-cat="others">⋯ Другие</li>
        </ul>
        <div class="big-section">2. ToDo</div>
        <div class="todo-preview">(будет позже)</div>
      </nav>

      <section class="content" id="content">
        <!-- animated container -->
        <div id="panel" class="panel enter-fade"></div>
      </section>
    </main>

    <footer class="app-footer">
      <small id="credits">Simple GUI calculator — English / Русский</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
